<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, user-scalable=no, interactive-widget=resizes-content"
		/>
		<link rel="preload" as="script" href="js/loading-error-handlers.js" />

		<title>mLounge</title>

		<!-- Browser tab icon -->
		<link
			id="favicon"
			rel="icon"
			sizes="any"
			href="img/mercury.svg"
			data-other="img/mercury-alerted.svg"
			type="image/svg+xml"
		/>

		<!-- Safari pinned tab icon -->
		<link rel="mask-icon" href="img/mercury-mask.svg" color="#FF4500" />

		<link rel="manifest" href="thelounge.webmanifest" />

		<!-- iPhone 4, iPhone 4s, iPhone 5, iPhone 5c, iPhone 5s, iPhone 6, iPhone 6s, iPhone 7, iPhone 7s, iPhone8 -->
		<link rel="apple-touch-icon" sizes="120x120" href="img/mercury-icon-512.png" />
		<!-- iPad and iPad mini @2x -->
		<link rel="apple-touch-icon" sizes="152x152" href="img/mercury-icon-512.png" />
		<!-- iPad Pro -->
		<link rel="apple-touch-icon" sizes="167x167" href="img/mercury-icon-512.png" />
		<!-- iPhone X, iPhone 8 Plus, iPhone 7 Plus, iPhone 6s Plus, iPhone 6 Plus -->
		<link rel="apple-touch-icon" sizes="180x180" href="img/mercury-icon-512.png" />

		<!-- Windows 8/10 - Edge tiles -->
		<meta name="application-name" content="mLounge" />
		<meta name="msapplication-TileColor" content="<!--thelounge-themecolor-->" />
		<meta name="msapplication-square70x70logo" content="img/mercury-icon-512.png" />
		<meta name="msapplication-square150x150logo" content="img/mercury-icon-512.png" />

		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="theme-color" content="<!--thelounge-themecolor-->" />
	</head>
	<body class="<!--thelounge-bodyclass-->" data-transports="<!--thelounge-transports-->">
		<div id="app"></div>
		<div id="loading">
			<div class="window">
				<div id="loading-status-container">
					<img
						src="img/mercury.svg"
						class="mercury-logo"
						alt="mLounge"
						width="112"
						height="112"
					/>
					<noscript
						><p>mLounge requires a modern browser with JavaScript enabled.</p></noscript
					>
					<p id="loading-page-message" style="display: none">Loading the app…</p>
				</div>
				<div id="loading-reload-container">
					<p id="loading-slow">
						This is taking longer than it should, there might be connectivity issues.
					</p>
					<button id="loading-reload" class="btn">Reload page</button>
				</div>
			</div>
		</div>
		<script src="js/loading-error-handlers.js"></script>
		<script type="module" src="js/vue.ts"></script>
	</body>
</html>
